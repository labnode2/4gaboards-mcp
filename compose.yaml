services:
  mcp:
    build: .
    image: 4gaboards-mcp:latest
    container_name: 4gaboards-mcp
    restart: unless-stopped
    env_file: .env
    # environment: wins over env_file, so the .env can't break the bind
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3000"
    ports:
      - "3000:3000"   # "127.0.0.1:3000:3000" if a reverse proxy runs on the same host
